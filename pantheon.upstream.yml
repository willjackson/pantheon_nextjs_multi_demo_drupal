api_version: 1
web_docroot: true
# See https://pantheon.io/docs/pantheon-yml/#enforce-https--hsts for valid values.
enforce_https: transitional
# Drupal 11 / core-recommended ^11 requires PHP >= 8.3 (see config.platform.php in composer.json).
php_version: 8.3
database:
  version: 10.4
drush_version: 10
build_step: true
protected_web_paths:
  - /private/
  - /sites/default/files/private/
  - /sites/default/files/config/

# Quicksilver: one-time setup when a site is first created from this upstream.
# deploy_product fires once, at site creation, on the dev environment — it is the
# only workflow supported in pantheon.upstream.yml. The script installs Drupal and
# applies the Next.js recipes so new sites boot ready to use.
workflows:
  deploy_product:
    after:
      - type: webphp
        description: 'Install Drupal and apply the Next.js recipes'
        script: scripts/quicksilver/deploy_product_install.php

