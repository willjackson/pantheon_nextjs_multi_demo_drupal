name: 'Pantheon Next.js Multiple Site Demo'
type: profile
description: 'Decoupled Drupal 11 backend for one or more Next.js front ends. Collects each front end URL during installation and applies the demo recipes so the next_site base/preview/revalidate URLs are configured automatically.'
core_version_requirement: '^11'

# Brand the installer and skip the profile-selection step. Sites created from the
# Pantheon custom upstream install directly with this profile.
distribution:
  name: 'Pantheon Next.js Multiple Site Demo'
  install:
    theme: pantheon_nextjs_installer
    finish_url: '/admin/content'

# Full "standard" profile baseline plus the modules this profile relies on. This
# list mirrors core/profiles/standard/standard.info.yml so a site installed from
# this profile matches a standard Drupal install, and then the vertical recipes
# layer JSON:API / next / decoupled_router / OAuth on top. Text formats + editor
# and the admin/front themes are still added by core recipes in the install task.
install:
  # --- core "standard" profile baseline (keep in sync with standard.info.yml) ---
  - node
  - block
  - breakpoint
  - ckeditor5
  - config
  - contextual
  - menu_link_content
  - datetime
  - block_content
  - editor
  - help
  - image
  - menu_ui
  - options
  - path
  - page_cache
  - dynamic_page_cache
  - big_pipe
  - taxonomy
  - dblog
  - navigation
  - field_ui
  - file
  - views
  - views_ui
  - automated_cron
  - announcements_feed
  # --- additional base modules this profile relies on ---
  - text

# No bundled themes here so the installer does not inject Stark; the admin/front
# themes are installed by core recipes during the install task.
themes: []
